name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked
      - name: Check documentation and decision records
        run: uv run python scripts/check_docs.py
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Verify runtime dependencies
        run: uv run python -c "import sys, sqlite3, mcp, pyarrow, guarded_data_mcp; print(sys.version); print('SQLite', sqlite3.sqlite_version); print('PyArrow', pyarrow.__version__)"
