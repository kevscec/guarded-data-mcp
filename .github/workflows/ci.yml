name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked
      - name: Check documentation and decision records
        run: uv run python scripts/check_docs.py
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Verify runtime dependencies
        run: uv run python -c "import sys, sqlite3, mcp, pyarrow, guarded_data_mcp; print(sys.version); print('SQLite', sqlite3.sqlite_version); print('PyArrow', pyarrow.__version__)"
